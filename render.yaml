services:
  # Backend FastAPI Web Service
  - type: web
    name: arthiksetu-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false # User will set their Gemini API key in Render dashboard

  # Frontend Static Site
  - type: web
    name: arthiksetu-frontend
    env: static
    buildCommand: cd Frontend && npm install && npm run build
    publishDir: Frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
